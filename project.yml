name: TranslateHUD
options:
  bundleIdPrefix: com.qi
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
  # 和 scripts/sparkle-version 保持同一版。公钥在 Config/Sparkle.xcconfig，私钥不进仓库。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  TranslateHUD:
    type: application
    platform: macOS
    sources:
      - path: TranslateHUD
        excludes:
          - "Resources/Info.plist"
          - "Resources/Legal/README.md"
    info:
      path: TranslateHUD/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: TranslateHUD
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026"
        NSScreenCaptureDescription: "TranslateHUD 需要屏幕录制权限来截取你选定的区域并翻译图中的文字。"
        NSAppleEventsUsageDescription: "TranslateHUD 需要发送 Apple Event 以读取其他应用中的选中文字。"
        CloudBaseEnvId: "$(CLOUDBASE_ENV_ID)"
        CloudBaseRegion: "$(CLOUDBASE_REGION)"
        TrialProxyBaseURL: "$(TRIAL_PROXY_BASE_URL)"
        CFBundleLocalizations:
          - zh-Hans
        SUFeedURL: "$(TRANSLATEHUD_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        TranslateHUDUpdatesEnabled: "$(TRANSLATEHUD_UPDATES_ENABLED)"
    configFiles:
      Debug: Config/Sparkle.xcconfig
      Release: Config/Sparkle.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qi.TranslateHUD
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "10"
        # 订阅地址。以后改成官网的 appcast 即可，不用改更新代码。
        TRANSLATEHUD_UPDATE_FEED_URL: "https://github.com/jisi71/TranslateHUD/releases/latest/download/appcast.xml"
        # 公钥由 Config/Sparkle.xcconfig 覆盖。这里留空，避免没配密钥时写成占位符。
        SPARKLE_PUBLIC_ED_KEY: ""
        # 本机和 ad-hoc 默认关闭。公证脚本会改成 YES，运行时还要再确认是 Developer ID。
        TRANSLATEHUD_UPDATES_ENABLED: NO
        # 改环境 ID 后必须重新 xcodegen generate（或跑 scripts/install-local.sh）。
        # TranslateHUD.xcodeproj 不入库，旧工程会继续把上一次的环境写进 App。
        CLOUDBASE_ENV_ID: translatehud-d4gl951eo8bef4702
        CLOUDBASE_REGION: ap-shanghai
        # 官方体验服务。设置里的地址留空时用这个。和 TrialConfig.defaultProxyBaseURL 保持同一串。
        TRIAL_PROXY_BASE_URL: "https://translatehud-d4gl951eo8bef4702-1445578102.ap-shanghai.app.tcloudbase.com/v1"
        ENABLE_HARDENED_RUNTIME: NO   # 自签名 + AX 兜底用 CGEvent 时关掉硬化运行时更省心
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "TranslateHUD Local Sign"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle

  TranslateHUDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TranslateHUDTests
    dependencies:
      - target: TranslateHUD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qi.TranslateHUDTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
